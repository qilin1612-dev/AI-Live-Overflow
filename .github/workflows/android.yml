name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: cd 创建一个Android悬浮窗应用App && chmod +x gradlew

    - name: Build with Gradle
      run: cd 创建一个Android悬浮窗应用App && ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: 创建一个Android悬浮窗应用App/app/build/outputs/apk/debug/app-debug.apk
